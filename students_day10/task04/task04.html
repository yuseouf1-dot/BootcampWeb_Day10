<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 04</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="mb-3">
            <label for="type" class="form-label">type</label>
            <input type="text" id="type" name="type" class="form-control" placeholder="e.g. shoes" autocomplete="off">
            <div id="typeMessage" class="alert mt-2 mb-0"></div>
        </div>

        <div class="mb-3">
            <label for="brand" class="form-label">brand</label>
            <input type="text" id="brand" name="brand" class="form-control" placeholder="e.g. adidas" autocomplete="off">
            <div id="brandMessage" class="alert mt-2 mb-0"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./task04.js"></script>
</body>
</html>
