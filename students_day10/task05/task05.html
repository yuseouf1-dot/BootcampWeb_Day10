<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 05</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <form id="searchForm">
            <div class="row g-3">
                <div class="col-sm-6 col-lg-3">
                    <label for="type" class="form-label">type</label>
                    <input type="text" id="type" name="type" class="form-control" placeholder="e.g. shoes" autocomplete="off">
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="brand" class="form-label">brand</label>
                    <input type="text" id="brand" name="brand" class="form-control" placeholder="e.g. vans" autocomplete="off">
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="price" class="form-label">price</label>
                    <input type="text" id="price" name="price" class="form-control" placeholder="e.g. <100, >42, =90" autocomplete="off">
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="number" class="form-label">number</label>
                    <input type="text" id="number" name="number" class="form-control" placeholder="e.g. 2" autocomplete="off">
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Search</button>
        </form>

        <div id="errors" class="alert alert-danger mt-3" hidden></div>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>type</th>
                    <th>brand</th>
                    <th>price</th>
                    <th>number</th>
                    <th>stock</th>
                </tr>
            </thead>
            <tbody id="results"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./task05.js"></script>
</body>
</html>
