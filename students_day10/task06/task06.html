<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 06</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <form id="productForm">
            <div class="row g-3">
                <div class="col-sm-6 col-lg-3">
                    <label for="type" class="form-label">type</label>
                    <input type="text" id="type" name="type" class="form-control" placeholder="e.g. shoes" autocomplete="off">
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="brand" class="form-label">brand</label>
                    <input type="text" id="brand" name="brand" class="form-control" placeholder="e.g. adidas" autocomplete="off">
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="price" class="form-label">price</label>
                    <input type="text" id="price" name="price" class="form-control" placeholder="e.g. 80 or =80" autocomplete="off">
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="number" class="form-label">number (stock)</label>
                    <input type="text" id="number" name="number" class="form-control" placeholder="e.g. 10" autocomplete="off">
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Add / Update</button>
        </form>

        <div id="message" class="alert mt-3" hidden></div>

        <table id="savedTable" class="table table-striped mt-3" hidden>
            <thead>
                <tr>
                    <th>type</th>
                    <th>brand</th>
                    <th>price</th>
                    <th>stock</th>
                </tr>
            </thead>
            <tbody id="saved"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./task06.js"></script>
</body>
</html>
