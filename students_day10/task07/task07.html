<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 07 - Mini Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #messages {
            height: 400px;
            overflow-y: auto;
        }
        .message-name {
            font-weight: 600;
        }
        .message-time {
            font-size: 0.8em;
        }
        .message-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container mt-5" style="max-width: 720px;">
        <div class="d-flex justify-content-between align-items-baseline mb-2">
            <h1 class="h3 mb-0">Mini Chat</h1>
            <small id="status" class="text-muted">connecting...</small>
        </div>

        <div id="messages" class="border rounded p-3 mb-3 bg-light">
            <p id="empty" class="text-muted text-center my-5">No messages yet. Say hello!</p>
        </div>

        <form id="chatForm">
            <div class="row g-2">
                <div class="col-sm-3">
                    <label for="name" class="visually-hidden">name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="name" maxlength="20" autocomplete="off">
                </div>
                <div class="col-sm-7">
                    <label for="message" class="visually-hidden">message</label>
                    <input type="text" id="message" name="message" class="form-control" placeholder="message" maxlength="500" autocomplete="off">
                </div>
                <div class="col-sm-2 d-grid">
                    <button type="submit" id="sendBtn" class="btn btn-primary">Send</button>
                </div>
            </div>
        </form>

        <div id="error" class="alert alert-danger mt-3" hidden></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./task07.js"></script>
</body>
</html>
